name: Deploy rental atlas
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: rental-atlas-publication
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public listings
        id: collection
        continue-on-error: true
        run: python scripts/collect.py
      - name: Refresh daily area statistics
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: python scripts/refresh_crime.py --if-stale
      - name: Test collectors and failure handling
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify data and filters
        run: node --test tests/model.test.mjs
      - name: Prepare public files
        run: |
          mkdir -p dist
          cp index.html dist/
          cp -r assets data dist/
          touch dist/.nojekyll
      - name: Save collection results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'Update public rental observations'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
